<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Command Center - Generative Dashboard</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.5s;
        }
        
        /* 🌟 NAYA LAAJAWAB GRID SYSTEM 🌟 */
        #dashboard-container {
            position: absolute;
            top: 80px;
            left: 400px; /* Room for AI Card */
            right: 40px;
            bottom: 120px; /* Room for Search Bar */
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columns */
            gap: 20px;
            align-content: start;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        /* Custom scrollbar for container */
        #dashboard-container::-webkit-scrollbar { width: 8px; }
        #dashboard-container::-webkit-scrollbar-track { background: transparent; }
        #dashboard-container::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 4px; }

        .widget {
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        
        .widget:hover {
            border-color: #00F0FF;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3);
        }

        .widget.full-width { grid-column: span 2; }
        .widget.half-width { grid-column: span 1; }

        .widget-title {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .kpi-value {
            font-size: 42px;
            font-weight: bold;
            color: #00F0FF;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .chart-wrapper {
            position: relative;
            height: 250px;
            width: 100%;
            flex-grow: 1;
        }

        /* LIGHT MODE OVERRIDES */
        body.light-mode { background-color: #e8ecef; }
        body.light-mode .widget {
            background: rgba(255, 255, 255, 0.9);
            border-color: #ddd;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        body.light-mode .widget:hover { border-color: #007BFF; }
        body.light-mode .widget-title { color: #555; }
        body.light-mode .kpi-value { color: #007BFF; text-shadow: none; }

        /* THE REST REMAINS SAME */
        #command-overlay {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 60%; max-width: 800px; background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px); border: 1px solid #00F0FF; border-radius: 20px;
            padding: 15px 25px; display: flex; gap: 15px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); z-index: 100;
            align-items: center;
        }
        body.light-mode #command-overlay { background: rgba(255, 255, 255, 0.9); border-color: #007BFF; }
        
        /* 🎤 MIC BUTTON STYLE */
        #mic-btn { background: transparent; border: none; color: #00F0FF; font-size: 24px; cursor: pointer; transition: 0.3s; padding: 0 5px; }
        #mic-btn:hover { transform: scale(1.1); }
        body.light-mode #mic-btn { color: #007BFF; }

        #cmd-input { flex: 1; background: transparent; border: none; color: white; font-size: 18px; outline: none; }
        body.light-mode #cmd-input { color: black; }
        
        #cmd-btn { background: #00F0FF; color: black; border: none; padding: 10px 25px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        body.light-mode #cmd-btn { background: #007BFF; color: white; }
        
        #status-text { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); color: #00F0FF; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; z-index: 100; display: none; }
        body.light-mode #status-text { color: #007BFF; }

        #ai-card {
            position: absolute; top: 30px; left: 30px; bottom: 120px;
            background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(8px);
            border: 1px solid #00F0FF; border-left: 5px solid #00F0FF;
            color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
            z-index: 100; display: none; width: 300px; overflow-y: auto; transition: 0.3s;
        }
        body.light-mode #ai-card { background: rgba(255,255,255,0.9); border-color: #007BFF; color: #333; }

        .top-btn { position: absolute; top: 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid #ffaa00; color: #ffaa00; padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 1000; transition: 0.3s; backdrop-filter: blur(5px); }
        .top-btn:hover { background: #ffaa00; color: #000; }
        #theme-btn { right: 160px; border-color: #00F0FF; color: #00F0FF; }
        #theme-btn:hover { background: #00F0FF; color: #000; }
        body.light-mode #theme-btn { border-color: #007BFF; color: #007BFF; }
        body.light-mode #theme-btn:hover { background: #007BFF; color: #fff; }
        #back-btn { right: 20px; }

        /* 🔥 SMART ACTION BUTTON 🔥 */
        .action-btn {
            background: linear-gradient(45deg, #FF0055, #FFAA00);
            border: none; color: white; padding: 15px; font-size: 16px;
            font-weight: bold; border-radius: 8px; cursor: pointer;
            width: 100%; margin-top: 20px; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }
        .action-btn:hover { opacity: 0.9; transform: scale(1.02); }

    </style>
</head>
<body>

    <button id="theme-btn" class="top-btn" onclick="toggleTheme()">☀️ Day Mode</button>
    <button id="back-btn" class="top-btn" onclick="window.history.back()">🤖 Back to Agent</button>

    <div id="status-text">Brainstorming Blueprint...</div>

    <div id="ai-card">
        <h3 id="card-title" style="margin: 0 0 10px 0; color: inherit; font-size: 18px; text-transform: uppercase;">📊 AI Analytics</h3>
        <p id="ai-insight-text" style="font-size: 15px; line-height: 1.5; color: inherit; margin-bottom: 20px; opacity: 0.9;"></p>
        <div id="ai-action-container"></div>
    </div>

    <div id="dashboard-container">
    </div>

    <div id="command-overlay">
        <button id="mic-btn" onclick="startVoiceRecognition()" title="Speak to AI">🎤</button>
        <input type="text" id="cmd-input" placeholder="Ask AI (Type or Speak)..." autocomplete="off" onkeypress="handleEnter(event)">
        <button id="cmd-btn" onclick="askAI()">Generate</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script>
        let chartInstances = []; // To store multiple charts
        window.lastAIData = null; 
        let isNight = true;

        Chart.defaults.font.family = "'Segoe UI', 'Arial', sans-serif";
        Chart.defaults.font.weight = 'bold';
        Chart.register(ChartDataLabels);

        function toggleTheme() {
            isNight = !isNight;
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById("theme-btn");
            btn.innerHTML = isNight ? "☀️ Day Mode" : "🌙 Night Mode";
            
            Chart.defaults.color = isNight ? '#ffffff' : '#333333';
            if(window.lastAIData) buildGenerativeUI(window.lastAIData);
        }

        const currencyFormatter = (value) => {
            if(typeof value !== 'number') return value;
            return "₹" + (value >= 100000 ? (value/100000).toFixed(1) + "L" : value.toLocaleString('en-IN'));
        };

        // ==========================================
        // 🎙️ VOICE RECOGNITION ENGINE
        // ==========================================
        function startVoiceRecognition() {
            const inputField = document.getElementById('cmd-input');
            const micBtn = document.getElementById('mic-btn');
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Bhai, aapka browser Voice Search support nahi karta. Chrome use karein.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-IN'; // English-India (Hinglish ke liye bhi kaam karta hai)
            recognition.interimResults = false;

            recognition.onstart = function() {
                inputField.placeholder = "Listening... Bol bhai...";
                micBtn.style.transform = "scale(1.3)";
                micBtn.style.textShadow = "0 0 15px #00F0FF";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                inputField.value = transcript;
                inputField.placeholder = "Ask AI (Type or Speak)...";
                askAI(); // Automatically AI ko bhej do
            };

            recognition.onerror = function() {
                inputField.placeholder = "Kuch error aayi, wapas try karein...";
            };

            recognition.onend = function() {
                micBtn.style.transform = "scale(1)";
                micBtn.style.textShadow = "none";
            };

            recognition.start();
        }

        // ==========================================
        // ⚡ REAL ACTION EXECUTION LOGIC
        // ==========================================
        function executeAction(payload) {
            console.log("Triggering Real Action:", payload);
            
            // Agar AI ne 'create_purchase_order' bheja hai toh asli ERP page par le jao
            if(payload === "create_purchase_order" || payload === "review_stock_levels" || payload === "draft_po") {
                window.location.href = "/purchase-order/create"; 
            } else {
                alert("Action Initiated: " + payload);
            }
        }

        function askAI() {
            const input = document.getElementById('cmd-input').value;
            if (!input) return;

            document.getElementById('status-text').style.display = 'block';
            document.getElementById('status-text').innerText = "Designing Dashboard Blueprint...";

            fetch('http://localhost:8000/api/generate-ui', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: input })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('status-text').innerText = "✅ Generation Complete!";
                window.lastAIData = data; 
                buildGenerativeUI(data);
                setTimeout(() => document.getElementById('status-text').style.display = 'none', 2000);
            })
            .catch(error => {
                document.getElementById('status-text').innerText = "❌ AI Core Offline";
                console.error(error);
                setTimeout(() => document.getElementById('status-text').style.display = 'none', 4000);
            });
        }

        function buildGenerativeUI(blueprint) {
            const container = document.getElementById('dashboard-container');
            
            // 1. Destroy old charts & clear container
            chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];
            container.innerHTML = ""; 

            // 2. Set AI Insights (Left Panel)
            document.getElementById('ai-card').style.display = 'block';
            document.getElementById('card-title').innerText = blueprint.dashboard_title || "Dashboard";
            document.getElementById('ai-insight-text').innerText = blueprint.ai_insights || "Here is your generated data.";

            // 3. Set Action Button (Now using executeAction instead of alert)
            const actionContainer = document.getElementById('ai-action-container');
            if (blueprint.suggested_action && blueprint.suggested_action.label) {
                actionContainer.innerHTML = `<button class="action-btn" onclick="executeAction('${blueprint.suggested_action.action_payload}')">⚡ ${blueprint.suggested_action.label}</button>`;
            } else {
                actionContainer.innerHTML = "";
            }

            // 4. Generate Widgets dynamically!
            const layout = blueprint.grid_layout || [];
            
            layout.forEach((widget, index) => {
                const widgetDiv = document.createElement('div');
                widgetDiv.className = `widget ${widget.width === 'half' ? 'half-width' : 'full-width'}`;
                
                // --- KPI CARD ---
                if (widget.component === 'kpi_card') {
                    let displayVal = typeof widget.value === 'number' ? currencyFormatter(widget.value) : widget.value;
                    widgetDiv.innerHTML = `
                        <div class="widget-title">${widget.title}</div>
                        <div class="kpi-value">${displayVal}</div>
                    `;
                    container.appendChild(widgetDiv);
                } 
                // --- CHART COMPONENT ---
                else if (widget.component === 'chart') {
                    const canvasId = `chart-canvas-${index}`;
                    widgetDiv.innerHTML = `
                        <div class="widget-title">${widget.title}</div>
                        <div class="chart-wrapper">
                            <canvas id="${canvasId}"></canvas>
                        </div>
                    `;
                    container.appendChild(widgetDiv);
                    drawChart(canvasId, widget);
                }
            });
        }

        // Helper function to draw charts inside the dynamic canvas
        function drawChart(canvasId, widgetData) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            const chartColorsNight = ['#00F0FF', '#FF0055', '#00FF66', '#FFDD00', '#AA00FF'];
            const chartColorsDay = ['#007BFF', '#DC3545', '#28A745', '#FFC107', '#6F42C1'];
            const activeColors = isNight ? chartColorsNight : chartColorsDay;

            let config = {
                type: widgetData.chart_type === 'metric' ? 'bar' : widgetData.chart_type, // fallback metric to bar
                data: {
                    labels: widgetData.labels,
                    datasets: [{
                        data: widgetData.data,
                        backgroundColor: widgetData.chart_type === 'line' ? activeColors[0]+'33' : activeColors,
                        borderColor: widgetData.chart_type === 'pie' ? (isNight?'#000':'#fff') : activeColors,
                        borderWidth: 2,
                        borderRadius: widgetData.chart_type === 'bar' ? 6 : 0,
                        fill: widgetData.chart_type === 'line'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: widgetData.chart_type === 'pie' ? true : false, position: 'right' },
                        datalabels: { color: isNight?'#fff':'#000', font: {weight: 'bold'}, formatter: (val) => val.toLocaleString('en-IN') }
                    },
                    scales: widgetData.chart_type === 'pie' ? {} : {
                        x: { grid: { display: false }, ticks: { color: isNight?'#888':'#555' } },
                        y: { grid: { color: isNight?'rgba(255,255,255,0.1)':'rgba(0,0,0,0.1)' }, ticks: { color: isNight?'#888':'#555' } }
                    }
                }
            };
            
            chartInstances.push(new Chart(ctx, config));
        }
    </script>
</body>
</html>
